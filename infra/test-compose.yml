name: securelab-tests
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: securelab_test
      POSTGRES_USER: securelab_test
      POSTGRES_PASSWORD: isolated_test_only
    ports:
      - '127.0.0.1:15432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U securelab_test -d securelab_test']
      interval: 2s
      timeout: 3s
      retries: 30
